name: Uniclav
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false
targets:
  Uniclav:
    type: application
    platform: iOS
    sources:
      - Uniclav
      - Shared
    info:
      path: Uniclav/Info.plist
      properties:
        CFBundleDisplayName: Uniclav
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Uniclav/Uniclav.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxlestage.uniclav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.uniclav
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: UniclavKeyboard
        embed: true
  UniclavKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - UniclavKeyboard
      - Shared
    info:
      path: UniclavKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Uniclav
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: fr-FR
            RequestsOpenAccess: false
    entitlements:
      path: UniclavKeyboard/UniclavKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxlestage.uniclav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.uniclav.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
