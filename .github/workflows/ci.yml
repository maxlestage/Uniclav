name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le site n'a pas besoin d'Xcode : un runner Linux suffit, et il répond en
  # quelques secondes là où la compilation iOS prend une minute.
  site:
    name: Site vitrine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  # Le projet Xcode est écrit à la main, sans générateur. Une référence
  # pendante ou un fichier manquant ne se verrait sinon qu'au bout des trois
  # minutes du runner macOS ; ici, en deux secondes sur Linux.
  project:
    name: Projet et icônes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/check_pbxproj.py
      # Les noms d'icônes sont répétés à quatre endroits qu'aucun compilateur
      # ne rapproche : une faute de frappe ne se verrait que sur un appareil.
      - run: python3 tools/check_icons.py

  build:
    name: Compilation iOS et watchOS
    runs-on: macos-15
    needs: project
    steps:
      - uses: actions/checkout@v5

      - name: Sélectionner la dernière version d'Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Xcode retenu : $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Pas de -sdk ici : le schéma embarque une cible watchOS, chaque cible
      # doit pouvoir résoudre son propre SDK.
      - name: Compiler l'app iOS, l'extension clavier et la montre embarquée
        run: |
          set -o pipefail
          xcodebuild build \
            -project Uniclav.xcodeproj \
            -scheme Uniclav \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compiler l'app montre seule
        run: |
          set -o pipefail
          xcodebuild build \
            -project Uniclav.xcodeproj \
            -scheme UniclavWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
